<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Meal Planner Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#38e07b",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122017",
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="font-display bg-background-light dark:bg-background-dark">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden text-[#122017] dark:text-[#f6f8f7]">
        <!-- Main Content Area with Scroll -->
        <main class="flex-grow pb-24">
            <!-- Top App Bar -->
            <div class="flex flex-col gap-2 p-4 pb-2">
                <div class="flex items-center h-12 justify-between">
                    <div class="flex size-12 shrink-0 items-center justify-start text-primary">
                        <span class="material-symbols-outlined text-4xl">restaurant_menu</span>
                    </div>
                    <div class="flex w-12 items-center justify-end">
                        <button
                            class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 bg-transparent text-[#122017] dark:text-[#f6f8f7] gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
                            <span class="material-symbols-outlined text-3xl">account_circle</span>
                        </button>
                    </div>
                </div>
                <h1 class="text-[#122017] dark:text-[#f6f8f7] tracking-light text-[28px] font-bold leading-tight">What
                    are you planning today?</h1>
            </div>
            <!-- Search Bar -->
            <div class="px-4 py-3">
                <label class="flex flex-col min-w-40 h-14 w-full">
                    <div class="flex w-full flex-1 items-stretch rounded-xl h-full">
                        <div
                            class="text-primary/70 dark:text-primary flex border-none bg-background-dark/5 dark:bg-background-light/10 items-center justify-center pl-4 rounded-l-xl border-r-0">
                            <span class="material-symbols-outlined">search</span>
                        </div>
                        <input
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-xl text-[#122017] dark:text-[#f6f8f7] focus:outline-0 focus:ring-0 border-none bg-background-dark/5 dark:bg-background-light/10 focus:border-none h-full placeholder:text-primary/70 dark:placeholder:text-primary px-4 pl-2 text-base font-normal leading-normal"
                            placeholder="Search for a recipe or ingredient" value="" />
                    </div>
                </label>
            </div>
            <!-- Image Grid for Meal Categories -->
            <div class="grid grid-cols-[repeat(auto-fit,minmax(158px,1fr))] gap-4 p-4">
                <div class="relative bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-4 aspect-[4/5] cursor-pointer"
                    data-alt="A bowl of oatmeal with fresh berries, representing breakfast."
                    style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuDJPS2Eo2iyZywlhh0LqoPzlu-A5yVtHxOtuwcLHDaj9gPrB8o4SM8liVfJsj9wJ8Zs5k1J1nE1sVY02Lwcie4ENsoV9akxLuU7bdmwf9rfDOo9YwV5a1LbV3A_-vDhGqkmjvCVpPLjaGe_iCdoeYk14ZgREZyYswNIWN7Ry5t92h435EURFFgWzVfLfeVxLTkPOkFoqhMH6o8U1R0SEDptg7bQroqSpuIkzk0S5pz2FRcgk_X7Ynf3xzh2LOHFnDKSs2ga7Xefa-4");'>
                    <div class="absolute top-4 left-4 text-white p-2 bg-black/20 rounded-full">
                        <span class="material-symbols-outlined">light_mode</span>
                    </div>
                    <p class="text-white text-lg font-bold leading-tight line-clamp-2">Breakfast</p>
                </div>
                <div class="relative bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-4 aspect-[4/5] cursor-pointer"
                    data-alt="A fresh green salad with grilled chicken, representing lunch."
                    style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuBwpaiPOvhLCDXB4hrh67yLeYkjcibEsSYH9vyHdYQmHWVy7Ku4KwXSUg4gu75g1AixQbABo0CylqA22__LmZFF-1xaPxsI4RFVLJuZVCIJE4V7-Xc3tx8xUGf6gJhttVOkzjuV2iA1HwyWRfPDXOcjq_zpyLsM8a8lP3iVxy4TfYhIJLnkrqZyrZ1Mk87mU45oi0onrO_oZV2ZaATFi_0ZPcAG9HvdEeHXpIjd9wavFO7AYqsdVMUcuprgp_AfnSYdA9zAfWley88");'>
                    <div class="absolute top-4 left-4 text-white p-2 bg-black/20 rounded-full">
                        <span class="material-symbols-outlined">lunch_dining</span>
                    </div>
                    <p class="text-white text-lg font-bold leading-tight line-clamp-2">Lunch</p>
                </div>
                <div class="relative bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-4 aspect-[4/5] cursor-pointer"
                    data-alt="A handful of mixed nuts and dried fruit, representing a snack."
                    style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuDl0iTwXPH1wE304OVQU2Z4RdtZ7mN0Slz_LrsrkMxKgYylD51CTjov97qv1fygLZFmwKaNvZoImlPzqp5LhdPkhWN9IDsS6xiXgyR1BWNnVg4GtI008ufuyXpMV7b5wXKa27OzF__93E2FK0GfeFHE3wFU4eRgX1f0GmQHRUulswH3qFjD4eTshmRWHvhXqrBbxzJDWzSUmWqDdJvFRPcDBZi376FvGVxDO5eh_WaA1UPbtr11Ie104kHv9UxCsOL9CyWo3N5h_T8");'>
                    <div class="absolute top-4 left-4 text-white p-2 bg-black/20 rounded-full">
                        <span class="material-symbols-outlined">bakery_dining</span>
                    </div>
                    <p class="text-white text-lg font-bold leading-tight line-clamp-2">Snack</p>
                </div>
                <div class="relative bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-4 aspect-[4/5] cursor-pointer"
                    data-alt="A roasted salmon fillet with asparagus, representing dinner."
                    style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuBgJK7v3kOWrXSN8t-z13qfzL-EuOjHb9u9LSJ038S0ivK4vZc_xAK-lDAZuNnmwAFJwcpZw6RMHENw2GqwtDN77fmianozxher8HWvtUN5KqkcrCjhnLJDQRA5IOajELEO-rFhPzS-4cm_b9Vr6-uqYfiLK8PIXOobIf-mYZ7dhHUIWN1Rwc4GpS25FwVW9rS27jEEww4dAGY-M5Q8bBulRUCVlAHbEWp-L0wEkeU8vMH-6_aRIc-U_XA4D8a9oBnbOt_Trx-vMhM");'>
                    <div class="absolute top-4 left-4 text-white p-2 bg-black/20 rounded-full">
                        <span class="material-symbols-outlined">dinner_dining</span>
                    </div>
                    <p class="text-white text-lg font-bold leading-tight line-clamp-2">Dinner</p>
                </div>
            </div>
        </main>
        <!-- Floating Action Button -->
        <div class="fixed bottom-24 right-4 z-10">
            <button
                class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 bg-primary text-[#122017] text-base font-bold leading-normal tracking-[0.015em] min-w-0 gap-3 px-6 shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined">add</span>
                <span class="truncate">Add Custom Meal</span>
            </button>
        </div>
        <!-- Bottom Navigation Bar -->
        <div class="fixed bottom-0 left-0 w-full bg-background-light dark:bg-background-dark z-20">
            <div class="flex gap-2 border-t border-background-dark/10 dark:border-background-light/10 px-4 pb-3 pt-2">
                <a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-primary" href="#">
                    <div class="flex h-8 items-center justify-center">
                        <span class="material-symbols-outlined fill">home</span>
                    </div>
                    <p class="text-primary text-xs font-medium leading-normal tracking-[0.015em]">Home</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1 text-[#122017]/50 dark:text-[#f6f8f7]/50"
                    href="#">
                    <div class="flex h-8 items-center justify-center">
                        <span class="material-symbols-outlined">calendar_month</span>
                    </div>
                    <p class="text-xs font-medium leading-normal tracking-[0.015em]">My Plan</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1 text-[#122017]/50 dark:text-[#f6f8f7]/50"
                    href="#">
                    <div class="flex h-8 items-center justify-center">
                        <span class="material-symbols-outlined">shopping_cart</span>
                    </div>
                    <p class="text-xs font-medium leading-normal tracking-[0.015em]">Groceries</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-end gap-1 text-[#122017]/50 dark:text-[#f6f8f7]/50"
                    href="#">
                    <div class="flex h-8 items-center justify-center">
                        <span class="material-symbols-outlined">settings</span>
                    </div>
                    <p class="text-xs font-medium leading-normal tracking-[0.015em]">Settings</p>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
